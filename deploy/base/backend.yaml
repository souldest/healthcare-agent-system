apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/souldest/healthcare-agent-system/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: healthcare-agent-config
          env:
            - name: OLLAMA_URL
              value: "http://46.62.250.100:11434"
            - name: OLLAMA_MODEL
              value: "llama3.2:1b"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
