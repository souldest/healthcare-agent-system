name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # PostgreSQL
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name healthcare-postgres \
            -e POSTGRES_USER=healthcare \
            -e POSTGRES_PASSWORD=healthcare \
            -e POSTGRES_DB=healthcare_ai \
            -p 5433:5432 \
            postgres:16

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker exec healthcare-postgres \
              pg_isready \
              -U healthcare \
              -d healthcare_ai; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done

          echo "PostgreSQL failed to start"
          docker logs healthcare-postgres
          exit 1

      # ChromaDB
      - name: Start ChromaDB
        run: |
          docker run -d \
            --name healthcare-chroma \
            -p 8004:8000 \
            chromadb/chroma

      - name: Wait for ChromaDB
        run: |
          for i in {1..60}; do
            if curl -fs http://localhost:8004/api/v2/heartbeat > /dev/null; then
              echo "ChromaDB is ready"
              exit 0
            fi
            sleep 1
          done

          echo "ChromaDB failed to start"
          docker logs healthcare-chroma
          exit 1

      # Ollama
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama..."

          for i in {1..60}; do
            if curl -fs http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Ollama failed to start"
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull embedding model
        run: |
          ollama pull nomic-embed-text:latest

      - name: Verify embedding model
        run: |
          ollama list
          curl -fs http://127.0.0.1:11434/api/tags

      # Environment
      - name: Configure environment
        run: |
          cat > .env <<'ENVEOF'
          DATABASE_URL=postgresql://healthcare:healthcare@localhost:5433/healthcare_ai
          CHROMA_HOST=localhost
          CHROMA_PORT=8004
          OLLAMA_EMBED_URL=http://127.0.0.1:11434/api/embed
          EMBEDDING_MODEL=nomic-embed-text:latest
          ENVEOF

      # Chroma test data
      - name: Seed Chroma test data
        env:
          CHROMA_HOST: localhost
          CHROMA_PORT: "8004"
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" \
          python backend/scripts/seed_test_chroma.py

      # API
      - name: Start API
        env:
          DATABASE_URL: postgresql://healthcare:healthcare@localhost:5433/healthcare_ai
          CHROMA_HOST: localhost
          CHROMA_PORT: "8004"
          OLLAMA_EMBED_URL: http://127.0.0.1:11434/api/embed
          EMBEDDING_MODEL: nomic-embed-text:latest
          DATABRICKS_HOST: ""
          DATABRICKS_WAREHOUSE_ID: ""
          DATABRICKS_TOKEN: ""
          CI: "true"
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" \
          nohup uvicorn backend.app.main:app \
            --host 0.0.0.0 \
            --port 8002 \
            > /tmp/api.log 2>&1 &

          echo $! > /tmp/api.pid

      - name: Wait for API
        run: |
          echo "Waiting for API..."

          for i in {1..60}; do
            if curl -fs http://127.0.0.1:8002/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            echo "Attempt $i/60..."
            sleep 1
          done

          echo "API failed to start"
          echo "===== API LOG ====="
          cat /tmp/api.log || true
          echo "===== PROCESS ====="
          ps aux | grep -E "uvicorn|python" || true
          exit 1

      # Verify all services immediately before pytest
      - name: Verify services
        run: |
          echo "===== PostgreSQL ====="
          docker exec healthcare-postgres pg_isready \
            -U healthcare \
            -d healthcare_ai

          echo "===== ChromaDB ====="
          curl -fs http://127.0.0.1:8004/api/v2/heartbeat

          echo "===== Ollama ====="
          curl -fs http://127.0.0.1:11434/api/tags

          echo "===== API ====="
          curl -fs http://127.0.0.1:8002/health

          echo
          echo "All services are reachable."

      # Full test suite
      - name: Run all backend tests
        env:
          CI: "true"
        run: |
          pytest -q backend/tests

      # Logs on failure
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "========================================"
          echo "===== Ollama ====="
          echo "========================================"
          cat /tmp/ollama.log || true

          echo "========================================"
          echo "===== API ====="
          echo "========================================"
          cat /tmp/api.log || true

          echo "========================================"
          echo "===== Processes ====="
          echo "========================================"
          ps aux | grep -E "ollama|uvicorn|python" || true

          echo "========================================"
          echo "===== Ports ====="
          echo "========================================"
          ss -lntp || true

          echo "========================================"
          echo "===== ChromaDB ====="
          echo "========================================"
          docker logs healthcare-chroma || true

          echo "========================================"
          echo "===== PostgreSQL ====="
          echo "========================================"
          docker logs healthcare-postgres || true
