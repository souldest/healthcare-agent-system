name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        working-directory: .
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        working-directory: .
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &

          for i in {1..60}; do
            if curl -fs http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready"
              break
            fi

            sleep 1
          done

          curl -fs http://localhost:11434/api/tags > /dev/null

      - name: Pull embedding model
        working-directory: .
        run: |
          ollama pull nomic-embed-text

      - name: Start API
        working-directory: .
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" \
          uvicorn backend.app.main:app \
            --host 0.0.0.0 \
            --port 8002 \
            > /tmp/api.log 2>&1 &

      - name: Wait for API
        working-directory: .
        run: |
          for i in {1..60}; do
            if curl -fs http://localhost:8002/health > /dev/null; then
              echo "API is ready"
              break
            fi

            sleep 1
          done

          curl -fs http://localhost:8002/health > /dev/null

      - name: Run tests
        run: |
          pytest -q

      - name: Show service logs on failure
        if: failure()
        working-directory: .
        run: |
          echo "===== Ollama ====="
          cat /tmp/ollama.log || true

          echo "===== API ====="
          cat /tmp/api.log || true
