name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security scanner
        run: |
          python -m pip install pip-audit

      - name: Dependency security scan
        working-directory: backend
        run: |
          pip-audit \
            -r requirements.txt \
            --ignore-vuln PYSEC-2026-311

      - name: Python syntax check
        working-directory: backend
        run: |
          python -m compileall app

      - name: Backend environment diagnostics
        working-directory: backend
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Pip ==="
          python -m pip --version
          echo "=== Pytest ==="
          python -m pytest --version
          echo "=== Relevant packages ==="
          python -m pip show pytest fastapi starlette pydantic httpx

      - name: Backend tests
        working-directory: backend
        run: |
          echo "::group::Running backend pytest"
          set +e
          python -m pytest -v
          TEST_EXIT=$?
          set -e
          echo "::endgroup::"

          echo "========================================"
          echo "PYTEST_EXIT_CODE=$TEST_EXIT"
          echo "========================================"

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::error title=Backend tests failed::pytest exited with code $TEST_EXIT"
          fi

          exit "$TEST_EXIT"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker / Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build backend image
        run: docker build -t healthcare-agent-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t healthcare-agent-frontend:ci ./frontend
