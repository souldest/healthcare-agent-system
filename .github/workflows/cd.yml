name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build backend image
        run: |
          docker build \
            -t healthcare-agent-system-backend:${GITHUB_REF_NAME} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t healthcare-agent-system-frontend:${GITHUB_REF_NAME} \
            ./frontend

      - name: Save Docker images
        run: |
          docker save \
            healthcare-agent-system-backend:${GITHUB_REF_NAME} \
            healthcare-agent-system-frontend:${GITHUB_REF_NAME} \
            -o healthcare-agent-system-${GITHUB_REF_NAME}.tar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-agent-system-${{ github.ref_name }}
          path: healthcare-agent-system-${{ github.ref_name }}.tar
