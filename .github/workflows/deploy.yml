name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking -d banking_poc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    env:
      DATABASE_URL: postgresql+psycopg://banking:banking@localhost:5432/banking_poc
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:1b

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama ready."
              exit 0
            fi
            echo "Waiting for Ollama..."
            sleep 2
          done

          echo "Ollama did not become ready."
          exit 1

      - name: Pull Ollama model
        run: |
          curl -fsS http://localhost:11434/api/pull \
            -d '{"name":"llama3.2:1b","stream":false}'

      - name: Verify Ollama model
        run: |
          curl -fsS http://localhost:11434/api/tags |             python -c "import json,sys; models=json.load(sys.stdin).get('models', []); names=[m.get('name') for m in models]; assert 'llama3.2:1b' in names, f'Model not found: {names}'"

      - name: Seed test database
        working-directory: backend
        run: python seed.py

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  mlops:
    name: MLOps Evaluation
    needs: test
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama ready."
              exit 0
            fi

            echo "Waiting for Ollama..."
            sleep 2
          done

          echo "Ollama did not become ready."
          exit 1

      - name: Pull evaluation model
        run: |
          curl -fsS http://localhost:11434/api/pull \
            -d '{"name":"llama3.2:1b","stream":false}'

      - name: Verify model
        run: |
          curl -fsS http://localhost:11434/api/tags |
            python -c '
          import json
          import sys

          models = json.load(sys.stdin).get("models", [])
          names = [m.get("name") for m in models]

          assert "llama3.2:1b" in names, f"Model not found: {names}"
          print("Model verified: llama3.2:1b")
          '

      - name: Run MLOps quality gate
        env:
          OLLAMA_URL: http://localhost:11434
        run: |
          python mlops/evaluation/evaluate.py

      - name: Upload MLOps evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-evaluation-${{ github.sha }}
          path: mlops-evaluation-result.json
          if-no-files-found: error


  docker:
    name: Build and Push Docker Images
    needs:
      - test
      - mlops
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  deploy:
    name: Deploy to Hetzner
    needs: docker
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e

            cd /opt/msg-banking-poc

            export BACKEND_IMAGE="$BACKEND_IMAGE"
            export FRONTEND_IMAGE="$FRONTEND_IMAGE"

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d \
              --remove-orphans

            echo "Waiting for backend..."

            for i in $(seq 1 30); do
              if docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                exec -T backend \
                python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)" \
                >/dev/null 2>&1; then
                echo "Backend healthy."
                break
              fi

              if [ "$i" = "30" ]; then
                echo "Backend healthcheck failed."
                docker compose \
                  --env-file .env \
                  -f docker-compose.prod.yml \
                  logs --tail=100 backend
                exit 1
              fi

              sleep 2
            done
