services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_poc
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: msg_banking_poc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://banking:banking@postgres:5432/banking_poc
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
    ports:
      - "8003:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "pip install -r requirements.txt && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:

# host access for Ollama from Docker containers
